<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fiesta de Graduación 8° Básico A • Colegio Altazor 2026</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink-primary: #1a2238;
      --ink-secondary: #3b4764;
      --ink-muted: #64748b;
      --gold-border: rgba(212, 175, 55, 0.72);
      --gold-highlight: rgba(245, 217, 126, 0.85);
      --gold-glow: 0 8px 26px rgba(212, 175, 55, 0.16), 0 10px 28px rgba(26, 34, 56, 0.08);
      --accent-crimson: #9e2a3b;
      --glass-bg: rgba(255, 255, 255, 0.62);
      --glass-bg-strong: rgba(255, 255, 255, 0.90);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: #f4f7fb;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       LIENZO MAESTRO 900x1700 PX (ZERO SCROLL)
    ========================================================= */
    #app-canvas {
      position: relative;
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 900 / 1700;
      width: auto;
      max-width: 100vw;
      background-color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 60px rgba(20, 28, 48, 0.14);
    }

    /* =========================================================
       FONDO DINÁMICO DE VIDEO + RESPALDO BOKEH LUMINOSO
    ========================================================= */
    .bg-fallback-bokeh {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(186, 230, 253, 0.72) 0%, transparent 45%),
        radial-gradient(circle at 82% 25%, rgba(196, 181, 253, 0.60) 0%, transparent 50%),
        radial-gradient(circle at 30% 80%, rgba(165, 243, 252, 0.65) 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, rgba(199, 210, 254, 0.65) 0%, transparent 45%),
        linear-gradient(160deg, #dde9f8 0%, #eef2f9 48%, #d8e4f8 100%);
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.1s ease;
      pointer-events: none;
    }

    #bg-video.loaded {
      opacity: 1;
    }

    .bg-soft-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.14) 50%,
        rgba(255, 255, 255, 0.36) 100%
      );
      pointer-events: none;
    }

    #confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      pointer-events: none;
    }

    /* =========================================================
       CONTROLES SUPERIORES FLOTANTES (COLEGIO ALTAZOR + MÚSICA)
    ========================================================= */
    .top-utility-bar {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.4vh 5.5% 0;
    }

    .school-badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.2px solid var(--gold-border);
      box-shadow: 0 4px 16px rgba(26, 34, 56, 0.06);
    }

    .school-badge-text {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10.5px, 1.4vh, 12.5px);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    .audio-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.2px solid var(--gold-border);
      box-shadow: 0 6px 20px rgba(26, 34, 56, 0.10);
      cursor: pointer;
      color: var(--ink-primary);
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .audio-btn:active {
      transform: scale(0.93);
    }

    .audio-note-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink-primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .audio-btn.playing .audio-note-circle {
      background: #b8891e;
      animation: noteBounce 1.2s infinite ease-in-out;
    }

    .audio-btn:not(.playing) {
      animation: attentionPulse 2.2s infinite ease-in-out;
    }

    @keyframes attentionPulse {
      0%, 100% { box-shadow: 0 6px 20px rgba(26, 34, 56, 0.12), 0 0 0 0 rgba(212, 175, 55, 0.45); }
      50% { box-shadow: 0 8px 24px rgba(26, 34, 56, 0.18), 0 0 0 7px rgba(212, 175, 55, 0); }
    }

    @keyframes noteBounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      35% { transform: scale(1.1) rotate(-8deg); }
      70% { transform: scale(1.06) rotate(8deg); }
    }

    .audio-note-circle svg {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    .audio-status-label {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10px, 1.3vh, 11.5px);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    /* =========================================================
       ZONA SUPERIOR RESERVADA PARA TÍTULO PNG TRANSPARENTE
    ========================================================= */
    #header-banner-slot {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 21vh;
      max-height: 24vh;
      padding: 1.5vh 6% 0.5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .elegant-title-guide {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6vh;
    }

    .title-kicker {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: clamp(11px, 1.45vh, 14px);
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: var(--ink-secondary);
    }

    .title-main {
      font-family: 'Outfit', sans-serif;
      font-weight: 200;
      font-size: clamp(25px, 3.8vh, 38px);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--ink-primary);
      line-height: 1.15;
    }

    .title-main strong {
      display: block;
      font-weight: 500;
      font-size: clamp(29px, 4.4vh, 44px);
      letter-spacing: 0.12em;
      margin-top: 2px;
    }

    .title-divider {
      width: 68px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #c9a236, transparent);
      margin-top: 0.9vh;
    }

    /* =========================================================
       RELOJ EN REVERSA ESTILIZADO CON TOQUE DORADO SUTIL
    ========================================================= */
    .countdown-strip {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0.5vh 6% 1.2vh;
    }

    .cd-pill {
      min-width: 62px;
      padding: 9px 11px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(226, 237, 253, 0.65));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.2px solid var(--gold-border);
      text-align: center;
      box-shadow: 0 6px 18px rgba(26, 34, 56, 0.06);
    }

    .cd-num {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: clamp(18px, 2.5vh, 24px);
      color: var(--ink-primary);
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .cd-lbl {
      display: block;
      font-size: clamp(8.5px, 1.1vh, 10.5px);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-secondary);
      margin-top: 3px;
    }

    /* =========================================================
       BOTONERA CENTRAL: TONOS BOKEH CELESTE/LAVANDA + ORILLA DORADA
    ========================================================= */
    .menu-stack {
      position: relative;
      z-index: 12;
      width: 100%;
      padding: 0.5vh 7.5%;
      display: flex;
      flex-direction: column;
      gap: 1.8vh;
    }

    .glass-action-btn {
      position: relative;
      width: 100%;
      padding: 1.95vh 20px;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        rgba(222, 239, 255, 0.78) 0%,
        rgba(235, 232, 253, 0.74) 52%,
        rgba(212, 238, 252, 0.80) 100%
      );
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.4px solid var(--gold-border);
      box-shadow: var(--gold-glow), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      color: var(--ink-primary);
      opacity: 0;
      transform: translateY(16px);
      animation: btnReveal 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), background 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
    }

    .glass-action-btn:nth-child(1) { animation-delay: 0.15s; }
    .glass-action-btn:nth-child(2) { animation-delay: 0.30s; }
    .glass-action-btn:nth-child(3) { animation-delay: 0.45s; }
    .glass-action-btn:nth-child(4) { animation-delay: 0.60s; }

    @keyframes btnReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass-action-btn:hover {
      background: linear-gradient(
        135deg,
        rgba(234, 245, 255, 0.90) 0%,
        rgba(242, 239, 255, 0.88) 52%,
        rgba(226, 244, 255, 0.92) 100%
      );
      border-color: var(--gold-highlight);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.24), 0 12px 30px rgba(26, 34, 56, 0.11);
    }

    .glass-action-btn.tapped {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.95);
    }

    .btn-left-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(212, 175, 55, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-primary);
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(26, 34, 56, 0.05);
    }

    .btn-icon-circle svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.5;
    }

    .btn-text-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: clamp(14.5px, 2vh, 17.5px);
      letter-spacing: 0.04em;
      color: var(--ink-primary);
    }

    .btn-subtitle {
      font-weight: 300;
      font-size: clamp(11px, 1.38vh, 12.8px);
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
    }

    .touch-hint-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9e7b22;
      opacity: 0.78;
      animation: gentleTap 2.2s infinite ease-in-out;
    }

    .touch-hint-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.5;
    }

    @keyframes gentleTap {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(0.88); opacity: 1; }
    }

    /* =========================================================
       FOOTER FIJO INFERIOR (UBICACIÓN -> GOOGLE MAPS + ORILLA DORADA)
    ========================================================= */
    .location-footer {
      position: relative;
      z-index: 12;
      padding: 1.2vh 7.5% 2.6vh;
    }

    .location-link-card {
      width: 100%;
      padding: 1.65vh 18px;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        rgba(235, 244, 255, 0.84) 0%,
        rgba(244, 242, 255, 0.82) 100%
      );
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.4px solid var(--gold-border);
      box-shadow: var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--ink-primary);
      transition: transform 0.22s ease, background 0.22s ease;
    }

    .location-link-card:active {
      transform: scale(0.97);
    }

    .loc-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .loc-pin-box {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-crimson);
      flex-shrink: 0;
    }

    .loc-pin-box svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.7;
    }

    .loc-address {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(11.5px, 1.48vh, 13.8px);
      line-height: 1.35;
      color: var(--ink-primary);
    }

    .loc-cta-pill {
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--ink-primary);
      border: 1px solid rgba(212, 175, 55, 0.65);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* =========================================================
       VENTANAS EMERGENTES (MODALES FINOS + ICONO TEMÁTICO + VOZ)
    ========================================================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 35;
      background: rgba(20, 28, 48, 0.30);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-height: 82vh;
      border-radius: 26px;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1.4px solid var(--gold-border);
      box-shadow: 0 24px 60px rgba(20, 28, 48, 0.20);
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(18px) scale(0.97);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .modal-backdrop.active .modal-sheet {
      transform: translateY(0) scale(1);
    }

    .modal-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .voice-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .voice-chip-btn {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid rgba(212, 175, 55, 0.55);
      background: rgba(255, 255, 255, 0.85);
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .close-modal-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.55);
      background: #ffffff;
      color: var(--ink-primary);
      font-size: 16px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .topic-voice-banner {
      width: 100%;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(235, 244, 255, 0.88), rgba(242, 239, 255, 0.84));
      border: 1px solid rgba(212, 175, 55, 0.55);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
    }

    .topic-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: #ffffff;
      border: 1.2px solid rgba(212, 175, 55, 0.65);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-primary);
      flex-shrink: 0;
    }

    .topic-icon-box svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.5;
    }

    .topic-icon-box.speaking {
      animation: iconPulseTalk 0.55s infinite alternate ease-in-out;
      border-color: #c9a236;
    }

    @keyframes iconPulseTalk {
      from { transform: scale(1); box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15); }
      to { transform: scale(1.06); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.38); }
    }

    .character-speech-hint {
      font-size: 12px;
      font-weight: 300;
      color: var(--ink-secondary);
      line-height: 1.45;
    }

    .modal-heading {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 21px;
      letter-spacing: 0.04em;
      color: var(--ink-primary);
    }

    .modal-body-text {
      font-size: 13.5px;
      font-weight: 300;
      line-height: 1.65;
      color: var(--ink-secondary);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-body-text strong {
      font-weight: 500;
      color: var(--ink-primary);
    }

    .info-card-clean {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(235, 244, 255, 0.55);
      border: 1px solid rgba(212, 175, 55, 0.45);
    }

    .clean-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.55);
      background: rgba(255, 255, 255, 0.92);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 300;
      color: var(--ink-primary);
      outline: none;
    }

    .clean-input:focus {
      border-color: #b8891e;
    }

    .primary-pill-action {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid var(--gold-border);
      background: var(--ink-primary);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .primary-pill-action:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <main id="app-canvas">
    <!-- Capa 0: Respaldo visual bokeh luminoso -->
    <div class="bg-fallback-bokeh"></div>

    <!-- Capa 1: Video dinámico automático (video1.mp4, video2.mp4, video3.mp4...) -->
    <video id="bg-video" autoplay loop muted playsinline></video>

    <!-- Capa 2: Velo sutil de contraste -->
    <div class="bg-soft-veil"></div>

    <!-- Capa 40: Confeti sutil al tocar botones -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Barra Superior Minimalista: Solo Colegio Altazor + Botón de Nota Musical -->
    <div class="top-utility-bar">
      <div class="school-badge-pill">
        <span class="school-badge-text">Colegio Altazor</span>
      </div>

      <button class="audio-btn" id="audio-toggle" aria-label="Música de fondo" title="Activar o pausar música">
        <span class="audio-note-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </span>
        <span class="audio-status-label" id="audio-label">Música</span>
      </button>
    </div>

    <!-- Espacio Superior Reservado para Encabezado PNG Transparente -->
    <header id="header-banner-slot">
      <div class="elegant-title-guide">
        <span class="title-kicker">Generación 2026</span>
        <h1 class="title-main">Fiesta de Graduación <strong>8° Básico A</strong></h1>
        <div class="title-divider"></div>
      </div>
    </header>

  <script>
    /* =====================================================================
       1. CONFIGURACIÓN EDITABLE (VIDEOS, MÚSICA 1.MP3/2.MP3, WHATSAPP)
    ===================================================================== */
    const CONFIG = {
      EVENT_DATE: '2026-12-18T21:00:00-03:00',
      WHATSAPP_DJ: '56991081769',        // +56 9 9108 1769 (Playlist del curso)
      WHATSAPP_DIRECTIVA: '56999357466', // +56 9 9935 7466 (Consultas directas)
      VIDEO_PREFIX: 'video',             // Busca automáticamente video1.mp4, video2.mp4, video3.mp4...
      VIDEO_EXT: '.mp4',
      AUDIO_EXT: '.mp3'                  // Busca automáticamente 1.mp3, 2.mp3, 3.mp3...
    };

    /* =====================================================================
       SONDEO NATIVO DE ARCHIVOS MULTIMEDIA (COMPATIBLE CON FILE:// Y WEB)
    ===================================================================== */
    function checkVideoExists(src) {
      return new Promise((resolve) => {
        const testVid = document.createElement('video');
        testVid.preload = 'metadata';
        testVid.onloadedmetadata = () => {
          testVid.src = '';
          resolve(true);
        };
        testVid.onerror = () => {
          resolve(false);
        };
        testVid.src = src;
      });
    }

    function checkAudioExists(src) {
      return new Promise((resolve) => {
        const testAud = new Audio();
        testAud.preload = 'metadata';
        testAud.onloadedmetadata = () => {
          testAud.src = '';
          resolve(true);
        };
        testAud.onerror = () => {
          resolve(false);
        };
        testAud.src = src;
      });
    }

    /* =====================================================================
       2. DETECCIÓN AUTOMÁTICA Y ROTACIÓN SIN REPETICIÓN DE VIDEOS MP4
    ===================================================================== */
    async function initDynamicVideoBackground() {
      const videoEl = document.getElementById('bg-video');
      const availableVideos = [];

      for (let i = 1; i <= 30; i++) {
        const candidate = `${CONFIG.VIDEO_PREFIX}${i}${CONFIG.VIDEO_EXT}`;
        const exists = await checkVideoExists(candidate);
        if (exists) {
          availableVideos.push(candidate);
        } else {
          break;
        }
      }

      if (availableVideos.length === 0) return;

      const lastUsed = localStorage.getItem('gala8a_last_video');
      let pool = availableVideos.filter(v => v !== lastUsed);
      if (pool.length === 0) pool = availableVideos;

      const selectedVideo = pool[Math.floor(Math.random() * pool.length)];
      localStorage.setItem('gala8a_last_video', selectedVideo);

      videoEl.src = selectedVideo;
      videoEl.addEventListener('loadeddata', () => {
        videoEl.classList.add('loaded');
        videoEl.play().catch(() => {});
      });
    }

    /* =====================================================================
       3. DETECCIÓN AUTOMÁTICA DE MP3 (1.MP3, 2.MP3...) + AUTOPLAY INTELIGENTE
    ===================================================================== */
    const audioEl = document.getElementById('bg-music');
    const audioBtn = document.getElementById('audio-toggle');
    const audioLabel = document.getElementById('audio-label');
    let audioPlaylist = [];
    let currentTrackIdx = 0;
    let userManuallyPaused = false;
    let isModalOpen = false;

    function updateAudioUI(isPlaying) {
      if (isPlaying) {
        audioBtn.classList.add('playing');
        audioLabel.textContent = 'Sonando';
      } else {
        audioBtn.classList.remove('playing');
        audioLabel.textContent = 'Música';
      }
    }

    async function initDynamicMusicPlayer() {
      const firstTrack = `1${CONFIG.AUDIO_EXT}`;
      const hasFirst = await checkAudioExists(firstTrack);
      if (!hasFirst) return;

      audioPlaylist.push(firstTrack);

      for (let i = 2; i <= 30; i++) {
        const candidate = `${i}${CONFIG.AUDIO_EXT}`;
        const exists = await checkAudioExists(candidate);
        if (exists) {
          audioPlaylist.push(candidate);
        } else {
          break;
        }
      }

      const lastTrack = localStorage.getItem('gala8a_last_track');
      let pool = audioPlaylist.filter(t => t !== lastTrack);
      if (pool.length === 0) pool = audioPlaylist;
      const initialTrack = pool[Math.floor(Math.random() * pool.length)];
      currentTrackIdx = audioPlaylist.indexOf(initialTrack);
      localStorage.setItem('gala8a_last_track', initialTrack);

      audioEl.src = audioPlaylist[currentTrackIdx];
      audioEl.volume = 1.0;

      audioEl.addEventListener('ended', () => {
        currentTrackIdx = (currentTrackIdx + 1) % audioPlaylist.length;
        audioEl.src = audioPlaylist[currentTrackIdx];
        audioEl.play().then(() => updateAudioUI(true)).catch(() => updateAudioUI(false));
      });

      audioEl.addEventListener('error', () => {
        if (audioPlaylist.length > 1) {
          currentTrackIdx = (currentTrackIdx + 1) % audioPlaylist.length;
          audioEl.src = audioPlaylist[currentTrackIdx];
          audioEl.play().catch(() => {});
        }
      });

      const removeUnlockListeners = () => {
        document.removeEventListener('pointerdown', tryAutoPlay);
        document.removeEventListener('touchstart', tryAutoPlay);
        document.removeEventListener('click', tryAutoPlay);
        document.removeEventListener('keydown', tryAutoPlay);
      };

      const tryAutoPlay = () => {
        if (userManuallyPaused || audioPlaylist.length === 0) return;
        if (!audioEl.paused) {
          updateAudioUI(true);
          removeUnlockListeners();
          return;
        }
        audioEl.play()
          .then(() => {
            updateAudioUI(true);
            removeUnlockListeners();
          })
          .catch(() => {
            updateAudioUI(false);
          });
      };

      tryAutoPlay();
      document.addEventListener('pointerdown', tryAutoPlay, { passive: true });
      document.addEventListener('touchstart', tryAutoPlay, { passive: true });
      document.addEventListener('click', tryAutoPlay);
      document.addEventListener('keydown', tryAutoPlay);
    }

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audioPlaylist.length === 0) {
        audioEl.src = `1${CONFIG.AUDIO_EXT}`;
        audioEl.play().then(() => {
          audioPlaylist = [`1${CONFIG.AUDIO_EXT}`];
          updateAudioUI(true);
        }).catch(() => {
          audioBtn.classList.toggle('playing');
        });
        return;
      }

      if (audioEl.paused) {
        userManuallyPaused = false;
        audioEl.muted = isModalOpen;
        audioEl.play().then(() => updateAudioUI(true)).catch(() => {});
      } else {
        userManuallyPaused = true;
        audioEl.pause();
        updateAudioUI(false);
      }
    });

    /* =====================================================================
       4. RELOJ EN REVERSA EN VIVO
    ===================================================================== */
    function initCountdown() {
      const target = new Date(CONFIG.EVENT_DATE).getTime();
      const elDays = document.getElementById('cd-days');
      const elHours = document.getElementById('cd-hours');
      const elMins = document.getElementById('cd-mins');
      const elSecs = document.getElementById('cd-secs');

      function update() {
        const now = Date.now();
        const diff = Math.max(0, target - now);

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / (1000 * 60)) % 60);
        const s = Math.floor((diff / 1000) % 60);

        elDays.textContent = String(d).padStart(2, '0');
        elHours.textContent = String(h).padStart(2, '0');
        elMins.textContent = String(m).padStart(2, '0');
        elSecs.textContent = String(s).padStart(2, '0');
      }

      update();
      setInterval(update, 1000);
    }

    /* =====================================================================
       5. DESTELLOS DE CONFETI SUTIL (DORADO Y TONOS BOKEH) AL TOCAR BOTONES
    ===================================================================== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      const rect = document.getElementById('app-canvas').getBoundingClientRect();
      confettiCanvas.width = rect.width;
      confettiCanvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnConfetti(clientX, clientY) {
      const rect = confettiCanvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const colors = ['#d4af37', '#f5d97e', '#ffffff', '#bae6fd', '#ddd6fe'];

      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: 3 + Math.random() * 3.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rot: Math.random() * 360
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles = particles.filter(p => p.alpha > 0.03);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.alpha *= 0.96;
        p.rot += 4;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });

      requestAnimationFrame(updateConfetti);
    }
    updateConfetti();

    /* =====================================================================
       6. VOZ ESTRICTAMENTE EN ESPAÑOL LATINO (SIN ACENTO DE ESPAÑA)
    ===================================================================== */
    let voiceMuted = false;
    let currentVoiceText = '';
    let selectedLatinVoice = null;
    let speechQueueTimer = null;

    function pickStrictLatinSpanishVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;

      const isSpainAccent = (v) => {
        const lang = (v.lang || '').toLowerCase();
        const name = (v.name || '').toLowerCase();
        if (lang === 'es-es' || lang.startsWith('es_es')) return true;
        const spainKeywords = [
          'españa', 'spain', 'castellano', 'mónica', 'monica',
          'jorge', 'marisol', 'enrique', 'conchita', 'lucía', 'lucia',
          'helena', 'laura', 'pablo', 'álvaro', 'alvaro', 'elvira'
        ];
        return spainKeywords.some(k => name.includes(k));
      };

      const latinVoices = voices.filter(v => {
        const lang = (v.lang || '').toLowerCase();
        return lang.startsWith('es') && !isSpainAccent(v);
      });

      const latinLangPriority = [
        'es-cl', 'es-mx', 'es-ar', 'es-co', 'es-pe', 'es-us', 'es-419'
      ];

      const preferredLatinNames = [
        'paulina', 'catalina', 'dalia', 'sabina', 'camila',
        'paloma', 'sofía', 'sofia', 'valeria', 'ximena',
        'latino', 'latin', 'méxico', 'mexico', 'chile', 'estados unidos', 'united states'
      ];

      for (const keyword of preferredLatinNames) {
        const match = latinVoices.find(v => v.name.toLowerCase().includes(keyword));
        if (match) return match;
      }

      for (const targetLang of latinLangPriority) {
        const match = latinVoices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith(targetLang));
        if (match) return match;
      }

      return latinVoices[0] || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        selectedLatinVoice = pickStrictLatinSpanishVoice();
      };
      selectedLatinVoice = pickStrictLatinSpanishVoice();
    }

    function stopSpeech() {
      if (speechQueueTimer) {
        clearTimeout(speechQueueTimer);
        speechQueueTimer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('modal-topic-icon').classList.remove('speaking');
    }

    function speakText(text) {
      currentVoiceText = text;
      const iconBox = document.getElementById('modal-topic-icon');
      const caption = document.getElementById('modal-voice-caption');
      caption.textContent = text;

      if (!('speechSynthesis' in window) || voiceMuted) {
        iconBox.classList.remove('speaking');
        return;
      }

      stopSpeech();
      if (!selectedLatinVoice) {
        selectedLatinVoice = pickStrictLatinSpanishVoice();
      }

      const sentences = text
        .split(/(?<=[.!?])\s+/)
        .map(s => s.trim())
        .filter(Boolean);

      let index = 0;

      function speakNextSentence() {
        if (voiceMuted || index >= sentences.length) {
          iconBox.classList.remove('speaking');
          return;
        }

        const utterance = new SpeechSynthesisUtterance(sentences[index]);
        if (selectedLatinVoice) {
          utterance.voice = selectedLatinVoice;
          utterance.lang = selectedLatinVoice.lang;
        } else {
          utterance.lang = 'es-MX';
        }

        utterance.rate = 0.90;
        utterance.pitch = 1.10;
        utterance.volume = 1.0;

        utterance.onstart = () => {
          iconBox.classList.add('speaking');
        };

        utterance.onend = () => {
          index++;
          if (index < sentences.length && !voiceMuted) {
            speechQueueTimer = setTimeout(speakNextSentence, 250);
          } else {
            iconBox.classList.remove('speaking');
          }
        };

        utterance.onerror = () => {
          iconBox.classList.remove('speaking');
        };

        window.speechSynthesis.speak(utterance);
      }

      speakNextSentence();
    }

       7. CONTENIDO E ICONOS TEMÁTICOS DE LAS VENTANAS EMERGENTES
    ===================================================================== */

        title: 'Playlist 8° Básico A',
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
        voice: '¡Queremos escuchar tus temas favoritos en la pista! Escribe tu nombre y la canción que no puede faltar esa noche, para sumarla directo a la playlist oficial del curso.',
        html: `
          <p>Pide las canciones que quieres escuchar esa noche para armar la playlist oficial del curso:</p>
          <input type="text" id="input-student-name" class="clean-input" placeholder="Tu nombre y apellido" />
          <input type="text" id="input-song-request" class="clean-input" placeholder="Canción y artista favorito" />
          <button type="button" class="primary-pill-action" id="btn-send-song">Enviar pedido por WhatsApp</button>
        `
      },
      'modal-consultas': {
        title: 'Consultas Directas',
        iconSvg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
        voice: '¿Tienes alguna duda sobre la fiesta de graduación? Escríbenos tu pregunta aquí mismo y te respondemos directo por WhatsApp con mucho gusto.',
        html: `
          <p>Si necesitas resolver alguna duda específica sobre la jornada, envíanos un mensaje directo:</p>
          <input type="text" id="input-query-text" class="clean-input" placeholder="Escribe tu consulta aquí..." />
          <button type="button" class="primary-pill-action" id="btn-send-query">Consultar por WhatsApp</button>
        `
      }
    };

    const backdrop = document.getElementById('modal-backdrop');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('modal-content');
    const modalTopicIcon = document.getElementById('modal-topic-icon');

    function openModal(key) {
      const data = MODALS_DATA[key];
      if (!data) return;

      isModalOpen = true;
      audioEl.muted = true; // Silencia por completo la música de fondo mientras la ventana esté abierta

      modalTitle.textContent = data.title;
      modalTopicIcon.innerHTML = data.iconSvg;
      modalContent.innerHTML = data.html;
      backdrop.classList.add('active');
      speakText(data.voice);

      const btnSong = document.getElementById('btn-send-song');
      if (btnSong) {
        btnSong.addEventListener('click', () => {
          const name = document.getElementById('input-student-name').value.trim() || 'Alumno 8°A';
          const song = document.getElementById('input-song-request').value.trim();
          if (!song) {
            alert('Escribe el nombre de la canción que deseas pedir.');
            return;
          }
          const msg = encodeURIComponent(`Hola! Soy ${name} (8° Básico A) y pido esta canción para la Fiesta de Graduación: ${song}`);
          window.open(`https://wa.me/${CONFIG.WHATSAPP_DJ}?text=${msg}`, '_blank');
        });
      }

      const btnQuery = document.getElementById('btn-send-query');
      if (btnQuery) {
        btnQuery.addEventListener('click', () => {
          const query = document.getElementById('input-query-text').value.trim() || 'Hola, tengo una consulta sobre la Fiesta de Graduación 8°A.';
          const msg = encodeURIComponent(query);
          window.open(`https://wa.me/${CONFIG.WHATSAPP_DIRECTIVA}?text=${msg}`, '_blank');
        });
      }
    }

    function closeModal() {
      isModalOpen = false;
      backdrop.classList.remove('active');
      stopSpeech();
      audioEl.muted = false; // Restaura la música de fondo al salir de la ventana
    }

    document.querySelectorAll('.glass-action-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        btn.classList.add('tapped');
        spawnConfetti(e.clientX, e.clientY);
        setTimeout(() => {
          btn.classList.remove('tapped');
          openModal(btn.dataset.modal);
        }, 210);
      });
    });

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });

    document.getElementById('btn-replay-voice').addEventListener('click', () => {
      voiceMuted = false;
      document.getElementById('btn-mute-voice').textContent = 'Silenciar';
      speakText(currentVoiceText);
    });

    document.getElementById('btn-mute-voice').addEventListener('click', (e) => {
      voiceMuted = !voiceMuted;
      e.target.textContent = voiceMuted ? 'Activar voz' : 'Silenciar';
      if (voiceMuted) {
        stopSpeech();
      } else {
        speakText(currentVoiceText);
      }
    });

    /* =====================================================================
       INICIALIZACIÓN
    ===================================================================== */
    initDynamicVideoBackground();
    initDynamicMusicPlayer();
    initCountdown();
  </script>
</body>
</html>
