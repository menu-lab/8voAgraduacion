<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gran Gala 8° Básico A • Colegio Altazor 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink-primary: #1a2238;
      --ink-secondary: #4a5568;
      --ink-muted: #718096;
      --accent-soft: #3b5998;
      --accent-crimson: #9e2a3b;
      --glass-bg: rgba(255, 255, 255, 0.58);
      --glass-bg-strong: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 10px 30px rgba(26, 34, 56, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: #f4f7fb;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      color: var(--ink-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       LIENZO MAESTRO 900x1700 PX (ZERO SCROLL)
    ========================================================= */
    #app-canvas {
      position: relative;
      height: 100dvh;
      max-height: 100dvh;
      aspect-ratio: 900 / 1700;
      width: auto;
      max-width: 100vw;
      background-color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 60px rgba(20, 28, 48, 0.14);
    }

    /* =========================================================
       FONDO DINÁMICO DE VIDEO + RESPALDO BOKEH LUMINOSO
    ========================================================= */
    .bg-fallback-bokeh {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(186, 230, 253, 0.65) 0%, transparent 45%),
        radial-gradient(circle at 82% 25%, rgba(221, 214, 254, 0.55) 0%, transparent 50%),
        radial-gradient(circle at 30% 80%, rgba(165, 243, 252, 0.55) 0%, transparent 50%),
        radial-gradient(circle at 80% 85%, rgba(199, 210, 254, 0.6) 0%, transparent 45%),
        linear-gradient(160deg, #e8f1fb 0%, #f5f7fc 48%, #e4ecfa 100%);
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.1s ease;
      pointer-events: none;
    }

    #bg-video.loaded {
      opacity: 1;
    }

    .bg-soft-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.32) 0%,
        rgba(255, 255, 255, 0.18) 50%,
        rgba(255, 255, 255, 0.42) 100%
      );
      pointer-events: none;
    }

    #confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      pointer-events: none;
    }

    /* =========================================================
       CONTROLES SUPERIORES FLOTANTES (INSIGNIA + BOTÓN MÚSICA EVIDENTE)
    ========================================================= */
    .top-utility-bar {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.2vh 5.5% 0;
    }

    .school-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(26, 34, 56, 0.05);
    }

    .school-monogram {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(26, 34, 56, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 10px;
      color: var(--ink-primary);
      letter-spacing: -0.02em;
    }

    .school-monogram span {
      color: var(--accent-crimson);
      font-weight: 600;
    }

    .school-badge-text {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10px, 1.35vh, 12px);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    .audio-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px 8px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #ffffff;
      box-shadow: 0 6px 20px rgba(26, 34, 56, 0.12);
      cursor: pointer;
      color: var(--ink-primary);
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .audio-btn:active {
      transform: scale(0.93);
    }

    .audio-note-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink-primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .audio-btn.playing .audio-note-circle {
      background: var(--accent-crimson);
      animation: noteBounce 1.2s infinite ease-in-out;
    }

    .audio-btn:not(.playing) {
      animation: attentionPulse 2.2s infinite ease-in-out;
    }

    @keyframes attentionPulse {
      0%, 100% { box-shadow: 0 6px 20px rgba(26, 34, 56, 0.12), 0 0 0 0 rgba(158, 42, 59, 0.35); }
      50% { box-shadow: 0 8px 24px rgba(26, 34, 56, 0.18), 0 0 0 7px rgba(158, 42, 59, 0); }
    }

    @keyframes noteBounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      35% { transform: scale(1.1) rotate(-8deg); }
      70% { transform: scale(1.06) rotate(8deg); }
    }

    .audio-note-circle svg {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    .audio-status-label {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10px, 1.3vh, 11.5px);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    /* =========================================================
       ZONA SUPERIOR RESERVADA PARA TÍTULO PNG TRANSPARENTE
    ========================================================= */
    #header-banner-slot {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 17vh;
      max-height: 20vh;
      padding: 1vh 6% 0.5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .elegant-title-guide {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4vh;
    }

    .title-kicker {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      font-size: clamp(11px, 1.45vh, 14px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-secondary);
    }

    .title-main {
      font-family: 'Outfit', sans-serif;
      font-weight: 200;
      font-size: clamp(28px, 4.3vh, 42px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-primary);
      line-height: 1.08;
    }

    .title-main strong {
      font-weight: 500;
    }

    .title-divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ink-primary), transparent);
      margin-top: 0.6vh;
      opacity: 0.35;
    }

    /* =========================================================
       RELOJ EN REVERSA ESTILIZADO Y FINO
    ========================================================= */
    .countdown-strip {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.4vh 6%;
    }

    .cd-pill {
      min-width: 58px;
      padding: 7px 10px;
      border-radius: 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      text-align: center;
      box-shadow: 0 4px 14px rgba(26, 34, 56, 0.04);
    }

    .cd-num {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: clamp(16px, 2.3vh, 22px);
      color: var(--ink-primary);
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .cd-lbl {
      display: block;
      font-size: clamp(8px, 1.05vh, 10px);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    /* =========================================================
       CARRUSEL CIRCULAR 3D AUTOMÁTICO (FOTOS DEL CURSO)
    ========================================================= */
    .carousel-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 15.5vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 950px;
      overflow: hidden;
      margin: 0.4vh 0;
    }

    .carousel-ring {
      position: relative;
      width: 11vh;
      height: 11vh;
      transform-style: preserve-3d;
      cursor: grab;
    }

    .carousel-ring:active {
      cursor: grabbing;
    }

    .carousel-card {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 22px rgba(26, 34, 56, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: visible;
    }

    .carousel-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .student-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: linear-gradient(145deg, rgba(255,255,255,0.85), rgba(235,242,252,0.75));
      color: var(--ink-secondary);
    }

    .student-placeholder svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.3;
      opacity: 0.65;
    }

    .student-placeholder span {
      font-family: 'Outfit', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* =========================================================
       BOTONERA CENTRAL SUTIL, ELEGANTE Y ANIMADA
    ========================================================= */
    .menu-stack {
      position: relative;
      z-index: 12;
      width: 100%;
      padding: 0.5vh 7.5%;
      display: flex;
      flex-direction: column;
      gap: 1.45vh;
    }

    .glass-action-btn {
      position: relative;
      width: 100%;
      padding: 1.65vh 20px;
      border-radius: 18px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      color: var(--ink-primary);
      opacity: 0;
      transform: translateY(16px);
      animation: btnReveal 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), background 0.28s ease, box-shadow 0.28s ease;
    }

    .glass-action-btn:nth-child(1) { animation-delay: 0.15s; }
    .glass-action-btn:nth-child(2) { animation-delay: 0.30s; }
    .glass-action-btn:nth-child(3) { animation-delay: 0.45s; }
    .glass-action-btn:nth-child(4) { animation-delay: 0.60s; }

    @keyframes btnReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass-action-btn:hover {
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 32px rgba(26, 34, 56, 0.12);
    }

    .glass-action-btn.tapped {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.92);
    }

    .btn-left-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-primary);
      flex-shrink: 0;
    }

    .btn-icon-circle svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.5;
    }

    .btn-text-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .btn-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: clamp(14px, 1.9vh, 17px);
      letter-spacing: 0.04em;
      color: var(--ink-primary);
    }

    .btn-subtitle {
      font-weight: 300;
      font-size: clamp(11px, 1.35vh, 12.5px);
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
    }

    .touch-hint-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      opacity: 0.65;
      animation: gentleTap 2.2s infinite ease-in-out;
    }

    .touch-hint-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.4;
    }

    @keyframes gentleTap {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(0.88); opacity: 0.95; }
    }

    /* =========================================================
       FOOTER FIJO INFERIOR (EXCLUSIVO UBICACIÓN -> GOOGLE MAPS)
    ========================================================= */
    .location-footer {
      position: relative;
      z-index: 12;
      padding: 1.2vh 7.5% 2.4vh;
    }

    .location-link-card {
      width: 100%;
      padding: 1.5vh 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 26px rgba(26, 34, 56, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--ink-primary);
      transition: transform 0.22s ease, background 0.22s ease;
    }

    .location-link-card:active {
      transform: scale(0.97);
    }

    .loc-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .loc-pin-box {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(26, 34, 56, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-crimson);
      flex-shrink: 0;
    }

    .loc-pin-box svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.7;
    }

    .loc-address {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(11.5px, 1.45vh, 13.5px);
      line-height: 1.35;
      color: var(--ink-primary);
    }

    .loc-cta-pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--ink-primary);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* =========================================================
       VENTANAS EMERGENTES (MODALES FINOS + SLOT PERSONAJE + VOZ)
    ========================================================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 35;
      background: rgba(20, 28, 48, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-height: 82vh;
      border-radius: 26px;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid #ffffff;
      box-shadow: 0 24px 60px rgba(20, 28, 48, 0.18);
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(18px) scale(0.97);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .modal-backdrop.active .modal-sheet {
      transform: translateY(0) scale(1);
    }

    .modal-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .voice-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .voice-chip-btn {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid rgba(26, 34, 56, 0.12);
      background: rgba(255, 255, 255, 0.8);
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .close-modal-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(26, 34, 56, 0.1);
      background: #ffffff;
      color: var(--ink-primary);
      font-size: 16px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .character-modal-slot {
      width: 100%;
      min-height: 76px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(236,243,253,0.75));
      border: 1px dashed rgba(26, 34, 56, 0.16);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
    }

    .character-avatar-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid rgba(26, 34, 56, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      font-size: 10px;
      color: var(--ink-muted);
      text-align: center;
    }

    .character-avatar-box.speaking {
      animation: characterTalk 0.45s infinite alternate ease-in-out;
    }

    @keyframes characterTalk {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-3px) scale(1.03); }
    }

    .character-speech-hint {
      font-size: 12px;
      font-weight: 300;
      color: var(--ink-secondary);
      line-height: 1.4;
    }

    .modal-heading {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 21px;
      letter-spacing: 0.04em;
      color: var(--ink-primary);
    }

    .modal-body-text {
      font-size: 13.5px;
      font-weight: 300;
      line-height: 1.65;
      color: var(--ink-secondary);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-body-text strong {
      font-weight: 500;
      color: var(--ink-primary);
    }

    .info-card-clean {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(26, 34, 56, 0.06);
    }

    .clean-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(26, 34, 56, 0.14);
      background: rgba(255, 255, 255, 0.9);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 300;
      color: var(--ink-primary);
      outline: none;
    }

    .clean-input:focus {
      border-color: var(--ink-primary);
    }

    .primary-pill-action {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: none;
      background: var(--ink-primary);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .primary-pill-action:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <main id="app-canvas">
    <!-- Capa 0: Respaldo visual bokeh luminoso -->
    <div class="bg-fallback-bokeh"></div>

    <!-- Capa 1: Video dinámico automático (video1.mp4, video2.mp4, video3.mp4...) -->
    <video id="bg-video" autoplay loop muted playsinline></video>

    <!-- Capa 2: Velo sutil de contraste -->
    <div class="bg-soft-veil"></div>

    <!-- Capa 40: Confeti sutil al tocar botones -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Barra Superior Minimalista: Insignia Altazor + Botón Evidente de Nota Musical -->
    <div class="top-utility-bar">
      <div class="school-badge-pill">

    /* =====================================================================
       1. CONFIGURACIÓN EDITABLE (VIDEOS, MÚSICA 1.MP3/2.MP3, WHATSAPP, FOTOS)

    const CONFIG = {
      EVENT_DATE: '2026-12-18T21:00:00-03:00',
      WHATSAPP_DJ: '56900000000',        // Tu número de WhatsApp para pedidos musicales (ej: 56912345678)
      WHATSAPP_DIRECTIVA: '56900000000', // Número de WhatsApp para consultas directas
      VIDEO_PREFIX: 'video',             // Busca automáticamente video1.mp4, video2.mp4, video3.mp4...
      VIDEO_EXT: '.mp4',
      AUDIO_EXT: '.mp3',                 // Busca automáticamente 1.mp3, 2.mp3, 3.mp3...
      FOTOS_CURSO: [
        { nombre: 'Alumno 1', img: '' },
        { nombre: 'Alumno 2', img: '' },
        { nombre: 'Alumno 3', img: '' },
        { nombre: 'Alumno 4', img: '' },

    /* =====================================================================
       2. DETECCIÓN AUTOMÁTICA Y ROTACIÓN SIN REPETICIÓN DE VIDEOS MP4
    ===================================================================== */
    async function initDynamicVideoBackground() {
      const videoEl = document.getElementById('bg-video');
      const availableVideos = [];

      for (let i = 1; i <= 30; i++) {
        const candidate = `${CONFIG.VIDEO_PREFIX}${i}${CONFIG.VIDEO_EXT}`;
        try {
          const response = await fetch(candidate, { method: 'HEAD' });
          if (response.ok) {
            availableVideos.push(candidate);
          } else {
            break;
          }
        } catch (err) {
          break;
        }
      }

      if (availableVideos.length === 0) return;

      const lastUsed = localStorage.getItem('gala8a_last_video');
      let pool = availableVideos.filter(v => v !== lastUsed);
      if (pool.length === 0) pool = availableVideos;

      const selectedVideo = pool[Math.floor(Math.random() * pool.length)];
      localStorage.setItem('gala8a_last_video', selectedVideo);

      videoEl.src = selectedVideo;
      videoEl.addEventListener('loadeddata', () => {
        videoEl.classList.add('loaded');
        videoEl.play().catch(() => {});
      });
    }

    /* =====================================================================
       3. DETECCIÓN AUTOMÁTICA DE MP3 (1.MP3, 2.MP3...) + AUTOPLAY INTELIGENTE
    ===================================================================== */
    const audioEl = document.getElementById('bg-music');
    const audioBtn = document.getElementById('audio-toggle');
    const audioLabel = document.getElementById('audio-label');
    let audioPlaylist = [];
    let currentTrackIdx = 0;
    let userManuallyPaused = false;

    function updateAudioUI(isPlaying) {
      if (isPlaying) {
        audioBtn.classList.add('playing');
        audioLabel.textContent = 'Sonando';
      } else {
        audioBtn.classList.remove('playing');
        audioLabel.textContent = 'Música';
      }
    }

    async function initDynamicMusicPlayer() {
      for (let i = 1; i <= 30; i++) {
        const candidate = `${i}${CONFIG.AUDIO_EXT}`;
        try {
          const response = await fetch(candidate, { method: 'HEAD' });
          if (response.ok) {
            audioPlaylist.push(candidate);
          } else {
            break;
          }
        } catch (err) {
          break;
        }
      }

      if (audioPlaylist.length === 0) return;

      const lastTrack = localStorage.getItem('gala8a_last_track');
      let pool = audioPlaylist.filter(t => t !== lastTrack);
      if (pool.length === 0) pool = audioPlaylist;
      const initialTrack = pool[Math.floor(Math.random() * pool.length)];
      currentTrackIdx = audioPlaylist.indexOf(initialTrack);
      localStorage.setItem('gala8a_last_track', initialTrack);

      audioEl.src = audioPlaylist[currentTrackIdx];

      audioEl.addEventListener('ended', () => {
        currentTrackIdx = (currentTrackIdx + 1) % audioPlaylist.length;
        audioEl.src = audioPlaylist[currentTrackIdx];
        audioEl.play().then(() => updateAudioUI(true)).catch(() => updateAudioUI(false));
      });

      const tryAutoPlay = () => {
        if (userManuallyPaused || audioPlaylist.length === 0) return;
        audioEl.play()
          .then(() => {
            updateAudioUI(true);
            removeUnlockListeners();
          })
          .catch(() => {
            updateAudioUI(false);
          });
      };

      const removeUnlockListeners = () => {
        document.removeEventListener('pointerdown', tryAutoPlay);
        document.removeEventListener('keydown', tryAutoPlay);
      };

      tryAutoPlay();
      document.addEventListener('pointerdown', tryAutoPlay);
      document.addEventListener('keydown', tryAutoPlay);
    }

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audioPlaylist.length === 0) {
        audioBtn.classList.toggle('playing');
        return;
      }
      if (audioEl.paused) {
        userManuallyPaused = false;
        audioEl.play().then(() => updateAudioUI(true)).catch(() => {});
      } else {
        userManuallyPaused = true;
        audioEl.pause();
        updateAudioUI(false);
      }
    });

    /* =====================================================================
       4. RELOJ EN REVERSA EN VIVO
    ===================================================================== */
    function initCountdown() {
      const target = new Date(CONFIG.EVENT_DATE).getTime();
      const elDays = document.getElementById('cd-days');
      const elHours = document.getElementById('cd-hours');
      const elMins = document.getElementById('cd-mins');
      const elSecs = document.getElementById('cd-secs');

      function update() {
        const now = Date.now();
        const diff = Math.max(0, target - now);

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / (1000 * 60)) % 60);
        const s = Math.floor((diff / 1000) % 60);

        elDays.textContent = String(d).padStart(2, '0');
        elHours.textContent = String(h).padStart(2, '0');
        elMins.textContent = String(m).padStart(2, '0');
        elSecs.textContent = String(s).padStart(2, '0');
      }

      update();
      setInterval(update, 1000);
    }

    /* =====================================================================
       5. CARRUSEL CIRCULAR 3D AUTOMÁTICO (FOTOS DEL CURSO)
    ===================================================================== */
    function init3DCarousel() {
      const ring = document.getElementById('carousel-ring');
      const items = CONFIG.FOTOS_CURSO;
      const total = items.length;
      const stepAngle = 360 / total;
      const radius = Math.round((window.innerHeight * 0.11) / (2 * Math.tan(Math.PI / total))) + 38;

      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'carousel-card';
        card.style.transform = `rotateY(${idx * stepAngle}deg) translateZ(${radius}px)`;

        if (item.img) {
          card.innerHTML = `<img src="${item.img}" alt="${item.nombre}" loading="lazy" />`;
        } else {
          card.innerHTML = `
            <div class="student-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.8-4 14.2-4 16 0"/></svg>
              <span>${item.nombre}</span>
            </div>
          `;
        }
        ring.appendChild(card);
      });

      let angle = 0;
      let isDragging = false;
      let startX = 0;

      function animate() {
        if (!isDragging) {
          angle -= 0.28;
        }
        ring.style.transform = `rotateY(${angle}deg)`;
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      ring.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
      });
      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const delta = e.clientX - startX;
        startX = e.clientX;
        angle += delta * 0.45;
      });
      window.addEventListener('pointerup', () => {
        isDragging = false;
      });
    }

    /* =====================================================================
       6. DESTELLOS DE CONFETI SUTIL AL TOCAR BOTONES
    ===================================================================== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      const rect = document.getElementById('app-canvas').getBoundingClientRect();
      confettiCanvas.width = rect.width;
      confettiCanvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnConfetti(clientX, clientY) {
      const rect = confettiCanvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const colors = ['#ffffff', '#a5d8ff', '#d0bfff', '#1a2238', '#9e2a3b'];

      for (let i = 0; i < 26; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: 3 + Math.random() * 3.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          rot: Math.random() * 360
        });
      }
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles = particles.filter(p => p.alpha > 0.03);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.alpha *= 0.96;
        p.rot += 4;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });

      requestAnimationFrame(updateConfetti);
    }
    updateConfetti();

    /* =====================================================================
       7. VOZ NATURAL, CÁLIDA, PAUSADA Y JUVENIL + VENTANAS EMERGENTES
    ===================================================================== */
    let voiceMuted = false;
    let currentVoiceText = '';
    let selectedNaturalVoice = null;
    let speechQueueTimer = null;

    function pickBestNaturalSpanishVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;

      // Prioriza voces de alta naturalidad/neuronales en español latino y español general
      const preferredNames = [
        'google español',
        'dalia',      // Microsoft Natural México (muy cálida y juvenil)
        'paulina',    // Apple / macOS / iOS español latino natural
        'catalina',   // Apple español Chile
        'sabina',     // Microsoft español
        'camila',     // Amazon / Edge natural
        'paloma',
        'mónica',
        'monica',
        'sofía',
        'sofia',
        'natural',
        'neural'
      ];

      const spanishVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
      if (!spanishVoices.length) return null;

      for (const keyword of preferredNames) {
        const match = spanishVoices.find(v => v.name.toLowerCase().includes(keyword));
        if (match) return match;
      }

      // Evita voces masculinas muy graves si hay una opción femenina/juvenil más amable
      return spanishVoices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        selectedNaturalVoice = pickBestNaturalSpanishVoice();
      };
      selectedNaturalVoice = pickBestNaturalSpanishVoice();
    }

    function stopSpeech() {
      if (speechQueueTimer) {
        clearTimeout(speechQueueTimer);
        speechQueueTimer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.getElementById('character-avatar').classList.remove('speaking');
      audioEl.volume = 1.0;
    }

    function speakText(text) {
      currentVoiceText = text;
      const avatar = document.getElementById('character-avatar');
      const caption = document.getElementById('modal-voice-caption');
      caption.textContent = text;

      if (!('speechSynthesis' in window) || voiceMuted) {
        avatar.classList.remove('speaking');
        return;
      }

      stopSpeech();
      if (!selectedNaturalVoice) {
        selectedNaturalVoice = pickBestNaturalSpanishVoice();
      }

      // Divide el texto en frases cortas para dar pausas respiratorias naturales y evitar el efecto robot
      const sentences = text
        .split(/(?<=[.!?])\s+/)
        .map(s => s.trim())
        .filter(Boolean);

      let index = 0;

      function speakNextSentence() {
        if (voiceMuted || index >= sentences.length) {
          avatar.classList.remove('speaking');
          audioEl.volume = 1.0;
          return;
        }

        const utterance = new SpeechSynthesisUtterance(sentences[index]);
        if (selectedNaturalVoice) {
          utterance.voice = selectedNaturalVoice;
          utterance.lang = selectedNaturalVoice.lang;
        } else {
          utterance.lang = 'es-CL';
        }

        // Ritmo calmado, cordial y juvenil (ni acelerado ni plano)
        utterance.rate = 0.88;
        utterance.pitch = 1.12;
        utterance.volume = 1.0;

        utterance.onstart = () => {
          avatar.classList.add('speaking');
          if (!audioEl.paused) audioEl.volume = 0.20;
        };

        utterance.onend = () => {
          index++;
          if (index < sentences.length && !voiceMuted) {
            // Pausa amable entre frases
            speechQueueTimer = setTimeout(speakNextSentence, 260);
          } else {
            avatar.classList.remove('speaking');
            audioEl.volume = 1.0;
          }
        };

        utterance.onerror = () => {
          avatar.classList.remove('speaking');
          audioEl.volume = 1.0;
        };

        window.speechSynthesis.speak(utterance);
      }

      speakNextSentence();
    }

    const MODALS_DATA = {

      'modal-dresscode': {
        title: 'Dress Code Semiformal',
        voice: 'Para que disfruten y bailen con toda comodidad, el estilo de nuestra gala es semiformal. Las niñas pueden venir con un vestido cómodo que no sea largo de gala, o con un conjunto de pantalón muy lindo. Los niños pueden usar pantalón, incluso jeans sin rasgaduras, combinado con camisa y un blazer o chaleco sin mangas.',
        html: `
          <div class="info-card-clean">
            <strong>Niñas:</strong> Vestido (no largo de gala) o conjunto de pantalón cómodo con estilo semiformal, ideal para moverse y bailar.
          </div>
          <div class="info-card-clean">
            <strong>Niños:</strong> Pantalón (puede ser jeans sin rasgaduras ni roturas) combinado con camisa y blazer o chaleco sin mangas.
          </div>
        `
      },
      'modal-musica': {
        title: 'Playlist 8° Básico A',
        voice: '¡Queremos escuchar tus temas favoritos en la pista! Escribe tu nombre y la canción que no puede faltar esa noche, para sumarla directo a la playlist oficial del curso.',
        html: `
          <p>Pide las canciones que quieres escuchar esa noche para armar la playlist oficial del curso:</p>
          <input type="text" id="input-student-name" class="clean-input" placeholder="Tu nombre y apellido" />
          <input type="text" id="input-song-request" class="clean-input" placeholder="Canción y artista favorito" />
          <button type="button" class="primary-pill-action" id="btn-send-song">Enviar pedido por WhatsApp</button>
        `
      },
      'modal-consultas': {
        title: 'Consultas Directas',
        voice: '¿Tienes alguna duda sobre la gala? Escríbenos tu pregunta aquí mismo y te respondemos directo por WhatsApp con mucho gusto.',
        html: `
          <p>Si necesitas resolver alguna duda específica sobre la jornada, envíanos un mensaje directo:</p>
          <input type="text" id="input-query-text" class="clean-input" placeholder="Escribe tu consulta aquí..." />
          <button type="button" class="primary-pill-action" id="btn-send-query">Consultar por WhatsApp</button>
        `
      }
    };

    const backdrop = document.getElementById('modal-backdrop');
    const modalTitle = document.getElementById('modal-title');
    const modalContent = document.getElementById('modal-content');

    function openModal(key) {
      const data = MODALS_DATA[key];
      if (!data) return;

      modalTitle.textContent = data.title;
      modalContent.innerHTML = data.html;
      backdrop.classList.add('active');
      speakText(data.voice);

      const btnSong = document.getElementById('btn-send-song');
      if (btnSong) {
        btnSong.addEventListener('click', () => {
          const name = document.getElementById('input-student-name').value.trim() || 'Alumno 8°A';
          const song = document.getElementById('input-song-request').value.trim();
          if (!song) {
            alert('Escribe el nombre de la canción que deseas pedir.');
            return;
          }
          const msg = encodeURIComponent(`Hola! Soy ${name} (8° Básico A) y pido esta canción para la Gala: ${song}`);
          window.open(`https://wa.me/${CONFIG.WHATSAPP_DJ}?text=${msg}`, '_blank');
        });
      }

      const btnQuery = document.getElementById('btn-send-query');
      if (btnQuery) {
        btnQuery.addEventListener('click', () => {
          const query = document.getElementById('input-query-text').value.trim() || 'Hola, tengo una consulta sobre la Gran Gala 8°A.';
          const msg = encodeURIComponent(query);
          window.open(`https://wa.me/${CONFIG.WHATSAPP_DIRECTIVA}?text=${msg}`, '_blank');
        });
      }
    }

    function closeModal() {
      backdrop.classList.remove('active');
      stopSpeech();
    }

    document.querySelectorAll('.glass-action-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        btn.classList.add('tapped');
        spawnConfetti(e.clientX, e.clientY);
        setTimeout(() => {
          btn.classList.remove('tapped');
          openModal(btn.dataset.modal);
        }, 210);
      });
    });

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });

    document.getElementById('btn-replay-voice').addEventListener('click', () => {
      voiceMuted = false;
      document.getElementById('btn-mute-voice').textContent = 'Silenciar';
      speakText(currentVoiceText);
    });

    document.getElementById('btn-mute-voice').addEventListener('click', (e) => {
      voiceMuted = !voiceMuted;
      e.target.textContent = voiceMuted ? 'Activar voz' : 'Silenciar';
      if (voiceMuted) {
        stopSpeech();
      } else {
        speakText(currentVoiceText);
      }
    });

    /* =====================================================================
       INICIALIZACIÓN
    ===================================================================== */
    initDynamicVideoBackground();
    initDynamicMusicPlayer();
    initCountdown();
    init3DCarousel();
  </script>
</body>
</html>
